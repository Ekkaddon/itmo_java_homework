databaseChangeLog:
  - changeSet:
      id: 003-create-users-table
      author: homework6
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(20)
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-insert-default-user
      author: homework6
      changes:
        - insert:
            tableName: users
            columns:
              - column: {name: username, value: "admin"}
              - column: {name: password, value: "admin"}
              - column: {name: role, value: "ROLE_ADMIN"}
        - insert:
            tableName: users
            columns:
              - column: {name: username, value: "user"}
              - column: {name: password, value: "user"}
              - column: {name: role, value: "ROLE_USER"}