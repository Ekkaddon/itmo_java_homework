databaseChangeLog:
  - changeSet:
      id: 001-create-countries-table
      author: homework6
      changes:
        - createTable:
            tableName: countries
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(10)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name_ru
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: name_en
                  type: varchar(100)
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-create-regions-table
      author: homework6
      changes:
        - createTable:
            tableName: regions
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(10)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name_ru
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: name_en
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: country_id
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_regions_country
                    references: countries(id)

  - changeSet:
      id: 001-create-cities-table
      author: homework6
      changes:
        - createTable:
            tableName: cities
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(10)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name_ru
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: name_en
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: population
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: region_id
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_cities_region
                    references: regions(id)