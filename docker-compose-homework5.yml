version: '3.8'

services:
  postgres-homework5:
    image: postgres:15-alpine
    container_name: homework5_postgres
    environment:
      POSTGRES_DB: homework5db
      POSTGRES_USER: itmo_user
      POSTGRES_PASSWORD: itmo_pass
    ports:
      - "5433:5432"
    volumes:
      - homework5_postgres_data:/var/lib/postgresql/data

volumes:
  homework5_postgres_data: